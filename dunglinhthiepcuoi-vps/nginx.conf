server {
    listen 80;
    listen [::]:80;
    server_name thiepcuoi.example.com;

    root /var/www/dunglinhthiepcuoi;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~* \.(glb|ktx2|png|jpg|jpeg|webp|svg|ico|ttf|woff|woff2|mp3|ogg)$ {
        try_files $uri =404;
    }
}
