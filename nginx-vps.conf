# ==============================================================================
# CẤU HÌNH NGINX CHO VPS (DÙNG CHUNG THƯ MỤC, 2 TÊN MIỀN ĐỘC LẬP)
# Đường dẫn dự án trên VPS: /home/admin1/thiepcuoi/thiepcuoiDungLinh
# ==============================================================================

# 1. TÊN MIỀN CHÍNH: dunglinhthiepcuoi.online
# (Thiệp cưới chính + Admin Studio + Danh sách khách mời guest-list)
server {
    listen 80;
    listen [::]:80;
    server_name dunglinhthiepcuoi.online www.dunglinhthiepcuoi.online;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. SUBDOMAIN: love.dunglinhthiepcuoi.online
# (Hành trình tình yêu 2D & 3D - Nginx phục vụ tĩnh trực tiếp cực nhanh, 0MB RAM)
server {
    listen 80;
    listen [::]:80;
    server_name love.dunglinhthiepcuoi.online;

    root /home/admin1/thiepcuoi/thiepcuoiDungLinh/dunglinhthiepcuoi-vps/dist;
    index index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~ \.wasm$ {
        types { application/wasm wasm; }
        try_files $uri =404;
    }

    location ~* \.(glb|gltf|bin|ktx2|basis|png|jpg|jpeg|webp|svg|ico|ttf|woff|woff2|mp3|ogg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
